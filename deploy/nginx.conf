# PicUp Nginx 反代配置（宝塔面板使用）
#
# 使用方法：
#   1. 宝塔 → 添加站点 → 填入域名
#   2. 申请 SSL 证书
#   3. 站点设置 → 配置文件 → 将本文件内容粘贴到 server {} 块中
#   4. 修改 ssl_certificate / ssl_certificate_key 路径为宝塔实际路径
#   5. 修改 server_name 为实际域名
#
# 注意：宝塔会自动生成一些基础配置，你只需要把 location 块和相关设置
#       合并进去即可，不需要完全替换。

server {
    listen 80;
    server_name picup.ai-mendao.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name picup.ai-mendao.com;

    # ========== SSL 证书（按宝塔实际路径修改）==========
    ssl_certificate    /www/server/panel/vhost/cert/picup.ai-mendao.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/picup.ai-mendao.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ========== 通用代理头 ==========
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ========== /api/ → API 容器 (127.0.0.1:4000) ==========
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;        # 图片生成等长任务需要较长超时
        proxy_send_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_buffering off;            # 实时返回响应
    }

    # ========== /media/ → API 容器 (127.0.0.1:4000) ==========
    location /media/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_valid 200 7d;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ========== Next.js hash-named assets can be cached indefinitely ==========
    location ^~ /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # ========== 其他所有路径 → Web 容器 (127.0.0.1:3000) ==========
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        # HTML/RSC refers to the current deployment's chunk hashes. Never let a
        # proxy cache a document after those files have been replaced.
        proxy_cache off;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "private, no-cache, no-store, max-age=0, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # ========== 上传文件大小限制 ==========
    client_max_body_size 50m;

    # ========== 日志 ==========
    access_log /www/wwwlogs/picup.ai-mendao.com.log;
    error_log  /www/wwwlogs/picup.ai-mendao.com.error.log;
}
