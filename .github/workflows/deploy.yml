name: CI and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://picup:picup_password@localhost:5432/picup?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

  build_and_push:
    name: Build and Push Image
    runs-on: ubuntu-latest
    needs: check
    environment: production
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate ACR secrets
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          ACR_IMAGE: ${{ secrets.ACR_IMAGE }}
        run: |
          set -euo pipefail
          [ -n "$ACR_REGISTRY" ] || { echo "ACR_REGISTRY is empty"; exit 1; }
          [ -n "$ACR_USERNAME" ] || { echo "ACR_USERNAME is empty"; exit 1; }
          [ -n "$ACR_PASSWORD" ] || { echo "ACR_PASSWORD is empty"; exit 1; }
          [ -n "$ACR_IMAGE" ] || { echo "ACR_IMAGE is empty"; exit 1; }

      - name: Login Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Compute image tag
        id: meta
        run: |
          set -euo pipefail
          echo "image_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.ACR_IMAGE }}:latest
            ${{ secrets.ACR_IMAGE }}:${{ steps.meta.outputs.image_tag }}
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=
            API_INTERNAL_URL=http://api:4000
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build_and_push
    environment: production

    steps:
      - name: Prepare SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          PORT="${SERVER_PORT:-22}"
          mkdir -p ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/picup_deploy_key
          chmod 600 ~/.ssh/picup_deploy_key
          ssh-keyscan -p "$PORT" -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Deploy on server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_APP_DIR: ${{ secrets.SERVER_APP_DIR }}
          ACR_IMAGE: ${{ secrets.ACR_IMAGE }}
          IMAGE_TAG: ${{ needs.build_and_push.outputs.image_tag }}
        run: |
          set -euo pipefail
          PORT="${SERVER_PORT:-22}"
          ssh -i ~/.ssh/picup_deploy_key -p "$PORT" "$SERVER_USER@$SERVER_HOST" "
            set -e
            cd '$SERVER_APP_DIR'
            git fetch origin main
            git checkout main
            git pull --ff-only origin main
            export APP_IMAGE='${ACR_IMAGE}:${IMAGE_TAG}'
            docker compose pull migrate api web worker
            docker compose up -d --no-build --force-recreate
            docker image prune -f
            docker builder prune -f --filter 'until=24h'
            docker compose ps
          "
