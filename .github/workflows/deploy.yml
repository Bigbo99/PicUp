name: CI and Deploy

# Automatic deployment disabled - use SSH deployment instead
# To manually trigger this workflow, use workflow_dispatch
on:
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://picup:picup_password@localhost:5432/picup?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.30.0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @picup/api db:generate
      - run: pnpm typecheck
      - run: pnpm test
      - run: bash deploy/deploy.test.sh
      - run: pnpm build

  deploy:
    name: Build and Deploy on Server
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 60
    environment: production
    steps:
      - name: Prepare SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          PORT="${SERVER_PORT:-22}"
          mkdir -p ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/picup_deploy_key
          chmod 600 ~/.ssh/picup_deploy_key
          ssh-keyscan -p "$PORT" -H "$SERVER_HOST" >> ~/.ssh/known_hosts
      - name: Build and deploy on server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_APP_DIR: ${{ secrets.SERVER_APP_DIR }}
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          ACR_IMAGE: ${{ secrets.ACR_IMAGE }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          PORT="${SERVER_PORT:-22}"
          printf -v APP_DIR_Q '%q' "$SERVER_APP_DIR"
          printf -v DEPLOY_SHA_Q '%q' "$DEPLOY_SHA"
          printf -v ACR_REGISTRY_Q '%q' "$ACR_REGISTRY"
          printf -v ACR_USERNAME_Q '%q' "$ACR_USERNAME"
          printf -v ACR_PASSWORD_Q '%q' "$ACR_PASSWORD"
          printf -v ACR_IMAGE_Q '%q' "$ACR_IMAGE"
          ssh -i ~/.ssh/picup_deploy_key -p "$PORT" "$SERVER_USER@$SERVER_HOST" "
            set -e
            cd $APP_DIR_Q
            git fetch origin main
            git checkout main
            git merge --ff-only $DEPLOY_SHA_Q
            test \"\$(git rev-parse HEAD)\" = $DEPLOY_SHA_Q
            RELEASE_TAG=sha-${DEPLOY_SHA:0:7} \
            ACR_REGISTRY=$ACR_REGISTRY_Q \
            ACR_USERNAME=$ACR_USERNAME_Q \
            ACR_PASSWORD=$ACR_PASSWORD_Q \
            ACR_IMAGE=$ACR_IMAGE_Q \
            bash deploy/deploy.sh
          "
