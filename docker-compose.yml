services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PUBLISH_PORT:-${REDIS_PORT:-6379}}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-picup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-picup_password}
      POSTGRES_DB: ${POSTGRES_DB:-picup}
    ports:
      - "${POSTGRES_PUBLISH_PORT:-${POSTGRES_PORT:-5432}}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-picup} -d ${POSTGRES_DB:-picup}"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    image: ${APP_IMAGE:-picup-app:local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:20-alpine}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
    command: ["sh", "-lc", "node node_modules/.pnpm/prisma@*/node_modules/prisma/build/index.js migrate deploy --schema apps/api/prisma/schema.prisma"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-picup}:${POSTGRES_PASSWORD:-picup_password}@postgres:5432/${POSTGRES_DB:-picup}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    image: ${APP_IMAGE:-picup-app:local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:20-alpine}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
        API_INTERNAL_URL: http://api:4000
    restart: unless-stopped
    command: ["node", "apps/web/node_modules/next/dist/bin/next", "start", "apps/web", "-H", "0.0.0.0", "-p", "3000"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-picup}:${POSTGRES_PASSWORD:-picup_password}@postgres:5432/${POSTGRES_DB:-picup}?schema=public
      API_INTERNAL_URL: http://api:4000
    ports:
      - "${WEB_PUBLISH_PORT:-${WEB_PORT:-3000}}:3000"
    depends_on:
      api:
        condition: service_started

  api:
    image: ${APP_IMAGE:-picup-app:local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:20-alpine}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
    restart: unless-stopped
    command: ["node", "apps/api/dist/main.js"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-picup}:${POSTGRES_PASSWORD:-picup_password}@postgres:5432/${POSTGRES_DB:-picup}?schema=public
      REDIS_URL: redis://redis:6379
    ports:
      - "${API_PUBLISH_PORT:-${API_PORT:-4000}}:4000"
    volumes:
      - ./storage:/app/storage
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    image: ${APP_IMAGE:-picup-app:local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:20-alpine}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
    restart: unless-stopped
    command: ["node", "apps/api/dist/workers/image-worker.js"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-picup}:${POSTGRES_PASSWORD:-picup_password}@postgres:5432/${POSTGRES_DB:-picup}?schema=public
      REDIS_URL: redis://redis:6379
    volumes:
      - ./storage:/app/storage
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      api:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
