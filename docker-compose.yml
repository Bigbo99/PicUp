services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-picup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-picup_password}
      POSTGRES_DB: ${POSTGRES_DB:-picup}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-picup} -d ${POSTGRES_DB:-picup}"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    image: ${APP_IMAGE:-picup-app:local}
    build:
      context: .
      dockerfile: Dockerfile
    command: ["pnpm", "--filter", "@picup/api", "db:deploy"]
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    image: ${APP_IMAGE:-picup-app:local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["node", "apps/web/node_modules/next/dist/bin/next", "start", "apps/web", "-H", "0.0.0.0", "-p", "3000"]
    env_file:
      - .env
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_started

  api:
    image: ${APP_IMAGE:-picup-app:local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["node", "apps/api/dist/main.js"]
    env_file:
      - .env
    ports:
      - "${API_PORT:-4000}:4000"
    volumes:
      - picup_storage:/app/storage
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    image: ${APP_IMAGE:-picup-app:local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["node", "apps/api/dist/workers/image-worker.js"]
    env_file:
      - .env
    volumes:
      - picup_storage:/app/storage
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      api:
        condition: service_started

volumes:
  picup_storage:
  postgres_data:
  redis_data:
